name: Tests

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    env:
      # Fixed local test users — no GitHub secrets / remote project required
      TEST_ADMIN_EMAIL: admin@example.com
      TEST_ADMIN_PASSWORD: password123
      TEST_USER_EMAIL: user@example.com
      TEST_USER_PASSWORD: password123
      TEST_ANONYMOUS_PERSON_ID: '2830'
      SEED_DIRECTORY_COUNT: '0'
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase keys
        run: |
          supabase status -o env | node scripts/export-local-supabase-env.mjs >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed local database
        run: npm run seed:dev

      - name: E2E tests
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop
